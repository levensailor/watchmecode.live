[project]
name = "watchmecode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.3",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "uv>=0.13.7",
    "uvicorn>=0.54.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
